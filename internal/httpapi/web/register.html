<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta · Biblioteca</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <main class="auth-layout">
    <section class="intro">
      <a class="brand" href="/">Biblioteca<span>.</span></a>
      <p class="eyebrow">UM LUGAR SÓ SEU</p>
      <h1>Abra espaço<br>para novas histórias.</h1>
      <p class="intro-copy">Crie sua conta e comece a organizar sua biblioteca pessoal.</p>
    </section>
    <section class="card">
      <p class="eyebrow">COMECE POR AQUI</p>
      <h2>Criar sua conta</h2>
      <p class="muted">Leva só um instante.</p>
      <form data-auth-form="register">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <p class="help">Use pelo menos 8 caracteres.</p>
        <p class="form-error" role="alert" aria-live="polite"></p>
        <button type="submit">Criar conta</button>
      </form>
      <p class="switch">Já tem uma conta? <a href="/login">Entrar</a></p>
    </section>
  </main>
</body>
</html>
