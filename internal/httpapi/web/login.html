<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Biblioteca</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <main class="auth-layout">
    <section class="intro">
      <a class="brand" href="/">Biblioteca<span>.</span></a>
      <p class="eyebrow">SEU ESPAÇO DE LEITURA</p>
      <h1>Boas histórias<br>começam aqui.</h1>
      <p class="intro-copy">Sua biblioteca pessoal, organizada em um só lugar.</p>
    </section>
    <section class="card">
      <p class="eyebrow">BEM-VINDO DE VOLTA</p>
      <h2>Entrar na sua conta</h2>
      <p class="muted">Acesse sua biblioteca pessoal.</p>
      <form data-auth-form="login">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p class="form-error" role="alert" aria-live="polite"></p>
        <button type="submit">Entrar</button>
      </form>
      <p class="switch">Ainda não tem uma conta? <a href="/register">Criar conta</a></p>
    </section>
  </main>
</body>
</html>
